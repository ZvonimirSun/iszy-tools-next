allowBuilds:
  '@parcel/watcher': false
  '@zvonimirsun/iszy-nuxt-auth-layer': false
  '@zvonimirsun/map-sdk': false
  core-js: false
  esbuild: false
  json-editor-vue: true
  unrs-resolver: false
  vue-demi: false
